name: Publish Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths-ignore:
      - .github/workflows/*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      python_ver: 3.12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_ver }}

      - name: get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest

      # Only publish when plugin.json has a version that hasn't been released yet,
      # so pushes that don't bump the version never overwrite an existing release.
      - name: Check for existing release
        id: release
        if: github.event_name != 'pull_request'
        run: |
          tag="v${{ steps.version.outputs.prop }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already released; bump Version in plugin.json to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zip files
        if: steps.release.outputs.exists == 'false'
        run: |
          zip -r Flow.Launcher.Plugin.TDKSozluk.zip src data images main.py plugin.json -x "*__pycache__*"

      - name: Publish
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: 'Flow.Launcher.Plugin.TDKSozluk.zip'
          tag_name: "v${{ steps.version.outputs.prop }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
